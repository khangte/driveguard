plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

// 'local.properties' 파일에서 로드하기 위해 추가
Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

android {
    namespace 'com.example.drowsydrive'
    compileSdk 35

    buildFeatures {
        buildConfig true // BuildConfig 필드 활성화
        compose true
    }

    defaultConfig {
        applicationId "com.example.drowsydrive"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "NATIVE_APP_KEY", properties["NATIVE_APP_KEY"])
        buildConfigField("String", "REST_API_KEY", properties["REST_API_KEY"])
        // Bluetooth CO2 센서를 다시 사용할 때 true로 변경한다.
        buildConfigField("boolean", "CO2_SENSOR_ENABLED", "false")

        // Manifest에 전달할 변수 설정
        manifestPlaceholders = [
                KAKAO_APP_KEY: properties["NATIVE_APP_KEY"]
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    packaging {
        resources {
        }
    }
    lint {
        lintConfig file('lint.xml')
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {

    implementation libs.androidx.fragment
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    // compileSdk 35와 호환되는 Compose BOM으로 메인 화면을 단계적으로 전환한다.
    implementation platform(libs.androidx.compose.bom)
    androidTestImplementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.icons
    implementation libs.androidx.compose.preview
    implementation libs.androidx.activity
    debugImplementation libs.androidx.compose.tooling
    androidTestImplementation libs.androidx.compose.test
    debugImplementation libs.androidx.compose.test.manifest
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.test.rules

    // 최신 카카오맵 SDK 의존성 추가
    implementation libs.android

    // 위치 권한을 위한 Google Play Services 위치 라이브러리
    implementation libs.play.services.location

    implementation libs.face.detection
    
    // CameraX 라이브러리 추가
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view

}